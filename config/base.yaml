    correa: "#1d1f24"
    nube: "#ffffff"
    gota: "#d4e2ff"
    # ventanas: de día vidrio; de noche las que se prenden brillan cálidas y las otras quedan oscuras
    vidrio_dia: "#6d8aa8"
    ventana_noche: "#ffd27a"
    ventana_apagada: "#232b3a"
