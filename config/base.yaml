    repartidor: {libre: "#e6e6e6", yendo_a_restaurante: "#ffd400", yendo_a_cliente: "#3fb6ff"}
    pedido: {creado: "#c8c8c8", en_preparacion: "#eda100", listo: "#78dc78", en_camino: "#3fb6ff", urgente: "#ff3b3b"}
