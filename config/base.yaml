# Parámetros por defecto de la ciudad de domicilios.
# Regla: ningún número "mágico" vive en el código; todo lo ajustable está aquí.
# Los experimentos (config/experimentos/*.yaml) solo sobrescriben lo que cambian.

semilla: 42

tiempo:
  dias_por_episodio: 1        # 1 tick = 1 minuto, 1 día = 1440 ticks
  hora_inicio: 0              # el episodio arranca a medianoche

ciudad:
  tamano: 10                  # manzanas por lado -> 11 x 11 intersecciones
  longitud_calle_m: 400       # una cuadra "grande": cruzar la ciudad son ~8 km
  velocidad_base_m_min: 300   # moto en ciudad, unos 18 km/h
  semilla_mapa: 7             # mapa fijo para ENTRENAR y los experimentos; null = depende de la semilla del episodio
  edificios:
    universidades: 1
    oficinas: 8
    casas: 40
  restaurantes:
    - nombre: Pizza           # rápida y barata
      nodo: null              # null = posición aleatoria con la semilla del mapa
      precio_medio: 25000
      precio_desv: 3000
      prep_media: 12
      prep_desv: 3
      capacidad: 4
    - nombre: Hamburguesas    # intermedia
      nodo: null
      precio_medio: 32000
      precio_desv: 4000
      prep_media: 20
      prep_desv: 5
      capacidad: 3
    - nombre: Sushi           # lenta y cara
      nodo: null
      precio_medio: 45000
      precio_desv: 5000
      prep_media: 30
      prep_desv: 8
      capacidad: 2

eventos:
  azar_propio: false          # true en los duelos: las dos ciudades viven la misma lluvia y los mismos trancones
  lluvia:
    modo: estocastica         # estocastica | siempre | nunca
    prob_empezar_por_hora: 0.15
    prob_parar_por_hora: 0.35
    factor_velocidad: 0.7     # con lluvia la moto va al 70 %
  trancones:
    activos: true
    horas_pico: [[7, 9], [17, 19]]   # [inicio, fin) en horas
    fraccion_aristas: 0.3
    factor_min: 1.5
    factor_max: 3.0

pedidos:
  espera_maxima: 60           # minutos desde que se crea hasta que se cancela
  tarifa_domicilio: 5000      # lo que paga el habitante por el envío
  pago_base: 3000             # lo que gana el repartidor por entrega
  pago_por_cuadra: 300        # más lejos, más pago
  incentivo_por_minuto: 0     # el pago sube mientras el pedido espera sin repartidor
  prob_propina: 0.3
  propina_min: 1000
  propina_max: 5000

habitantes:
  cantidad: 30                # calibrado: con 3 repartidores se cancela ~15 %
  proporcion_estudiantes: 0.4
  desfase_horario_max: 45     # minutos; cada persona arranca su horario un poco distinto
  hambre_inicial: [10, 50]
  umbral_hambre: 70
  saciedad_comida: 75         # cuánto baja el hambre al comer
  energia_inicial: 80
  dinero_inicial: 200000
  ingreso_diario: 100000
  tasa_hambre:                # puntos de hambre por minuto según la actividad
    dormir: 0.04
    trabajar: 0.22
    estudiar: 0.22
    ejercicio: 0.40
    libre: 0.18
  tasa_energia:               # puntos de energía por minuto (negativo = cansa)
    dormir: 0.20
    trabajar: -0.08
    estudiar: -0.08
    ejercicio: -0.25
    libre: -0.03
  horarios:                   # [hora_inicio, hora_fin, actividad]
    trabajador:
      - [0, 6, dormir]
      - [6, 7, ejercicio]
      - [7, 8, libre]
      - [8, 17, trabajar]
      - [17, 23, libre]
      - [23, 24, dormir]
    estudiante:
      - [0, 7, dormir]
      - [7, 12, estudiar]
      - [12, 14, libre]
      - [14, 18, estudiar]
      - [18, 24, libre]
  preferencias:               # cada habitante muestrea sus propios pesos (heterogeneidad)
    peso_precio: [0.05, 0.15] # utilidad perdida por cada 1000 pesos
    peso_tiempo: [0.03, 0.08] # utilidad perdida por cada minuto de espera
    gusto_desv: 1.5
    gusto_base:
      Pizza: 6.0
      Hamburguesas: 7.0
      Sushi: 8.0
  cocinar:
    gusto: 5.0                # media; cada habitante muestrea el suyo con gusto_desv
    costo: 8000
    tiempo: 45
    energia_minima: 30
    gasto_energia: 10
  salir:
    gusto: 7.5                # media por habitante; calibrado para que sin lluvia ~7 salidas/día
    costo: 35000
    tiempo: 60
    penalizacion_lluvia: 3.0  # por eso con lluvia se pide más domicilio
  aprendizaje:                # bandit epsilon-greedy
    politica: egreedy
    epsilon: 0.1
    alpha: 0.2                # paso constante: los restaurantes cambian (lluvia, trancón)
    tiempo_esperado_inicial: 25   # lo que cree que tarda un domicilio antes de probar
    recompensa_cancelado: -5.0

repartidores:
  cantidad: 3
  politica: qlearning         # aleatoria | cercano | urgente | qlearning
  nodo_inicial: null          # null = aleatorio
  costo_por_minuto: 80        # gasolina + desgaste + tiempo, en pesos
  costo_espera_por_minuto: 20 # estar quieto también cuesta (tiempo de la persona)
  penalizacion_cancelado: 5000          # si se cancela un pedido que YO llevaba
  penalizacion_rechazo: 4000            # esperar habiendo pedidos (tasa de aceptación).
                                        # Con 0 el Q-learning escoge solo pedidos cómodos y la
                                        # cancelación sube de ~15 % a ~28 % (ver experimento 1).
  duracion_espera: 3        # minutos que dura la acción "esperar"
  escala_recompensa: 0.001    # recompensa en miles de pesos para que Q no explote
  qlearning:
    alpha: 0.1
    gamma: 0.97               # por minuto; una acción de k minutos descuenta gamma^k
                              # (0.99 hacía que esperar valiera casi lo mismo que trabajar)
    epsilon_inicial: 1.0
    epsilon_min: 0.05
    decaimiento_epsilon: 0.99 # por episodio
    # Contexto (estado)
    cortes_hora: [6, 11, 14, 18, 21]    # madrugada, mañana, almuerzo, tarde, cena, noche
    cortes_carga: [1, 3, 6]             # pedidos disponibles: 0, 1-2, 3-5, 6+
    # Tipo de pedido (acción)
    cortes_distancia: [3, 6, 10]        # cuadras de mí al restaurante
    cortes_entrega: [4, 8]              # cuadras del restaurante al cliente
    cortes_edad: [15, 30, 45]           # minutos que lleva esperando el pedido
  dqn:                        # Deep Q-Network (PyTorch): la tabla Q reemplazada por una red
    capas_ocultas: [64, 64]   # 12 entradas -> 64 -> 64 -> 1 valor Q por (situación, pedido)
    tasa_aprendizaje: 0.001   # Adam; el punto de partida que recomienda el curso (RN-01)
    gamma: 0.97               # igual que la tabla, para que la comparación sea justa
    epsilon_inicial: 1.0
    epsilon_min: 0.05
    decaimiento_epsilon: 0.99
    memoria: 50000            # experience replay: transiciones guardadas para reentrenar
    lote: 64                  # minilote por paso de gradiente
    minimo_para_entrenar: 1000   # no entrena hasta tener experiencias variadas
    entrenar_cada: 2          # un paso de gradiente cada 2 decisiones
    actualizar_objetivo_cada: 500 # pasos de gradiente entre copias a la red objetivo
    max_norma_gradiente: 10.0 # recorte del gradiente: evita saltos que hacen divergir la red
    semilla: 0                # pesos iniciales y muestreo de la memoria (reproducible)
    escalas:                  # dividir por esto deja las entradas cerca de [0, 1] (Frente 7)
      cuadras: 20
      minutos: 60
      pago: 10000
      pedidos: 10

gym:                          # entorno Gymnasium (sim/entorno_gym.py)
  max_pedidos: 8              # casillas de la observación; si hay más, se ven los 8 más viejos
  politica_otros: urgente     # los demás repartidores siguen una regla fija (no aprenden)
  limite_observacion: 10.0    # cota superior de la caja de observación (las entradas quedan ~[0, 1])
  dias_entrenamiento: 300     # experimentos/gym_dqn.py: mismo presupuesto que la tabla y la red
  dias_prueba: 30
  semilla: 1

que_aprendio:                 # experimentos/que_aprendio.py: cómo decide cada política
  dias: 30                    # días del bloque de PRUEBA (nunca vistos al entrenar)
  semilla: 1
  modelos:                    # entrenados 300 días (copias versionadas en modelos/)
    dqn: modelos/red_dqn_300dias.pt
    qlearning: modelos/tabla_q_300dias.npz

metricas:
  recolectar_cada: 10         # ticks entre muestras del DataCollector (0 = no recolectar)

# Predictor supervisado (experimentos/prediccion.py): con lo que se sabe cuando nace
# un pedido, ¿cuánto tardará (regresión) y se cancelará (clasificación)?
prediccion:
  politica: urgente           # la política "desplegada" que genera los datos (fija, no aprende)
  semilla_base: 9             # bloque de semillas propio: no se cruza con los experimentos 1-4
  dias:                       # partición POR DÍA, no por pedido (ver docstring del módulo)
    entrenamiento: 60
    validacion: 20
    prueba: 20
  numericas: [hora, lluvia, trancon, cuadras_entrega, pedidos_en_cocina,
              pedidos_sin_repartidor, repartidores_libres, cuadras_repartidor_libre]
  categoricas: [restaurante]
  semilla_modelos: 0          # random_state de Random Forest
  arboles: 200
  # Hiperparámetros que se eligen en VALIDACIÓN (la prueba se usa una sola vez).
  candidatos:
    ridge_alpha: [0.01, 0.1, 1, 10, 100]
    logistica_c: [0.01, 0.1, 1, 10, 100]
    knn_k: [1, 3, 5, 9, 15, 25, 41, 61]
    bosque_profundidad: [3, 5, 8, 12, 20]
  peso_clases: balanced       # solo ~10 % se cancela: sin esto el clasificador dice siempre "no"

vistas:                       # comunes a 2D, 3D y duelos (vistas/velocidad.py)
  # Velocidad en minutos simulados por SEGUNDO REAL; ↑/↓ recorren esta lista.
  minutos_por_segundo: [0.5, 1, 2, 4, 8, 15, 30, 60, 120]
  velocidad_inicial: 2        # una entrega (~30 min) se ve en ~15 s: se alcanza a seguir con los ojos
  hora_inicio: 11             # las demos arrancan antes del almuerzo; de madrugada todos duermen
  dias_demo: 7                # las demos siguen una semana (python main.py --dias N para cambiarlo)
  mapa_aleatorio: true        # cada demo abre en un mapa distinto (python main.py --mapa N repite uno)
  mapas_posibles: 100000      # mapas numerados de 0 a 99999: cada número ubica distinto los edificios
  hora_al_saltar: 7           # tecla N en 3D: salta a esta hora del día siguiente
  dt_maximo: 0.1              # s; recorta cuadros trabados para que la ciudad no salte
  avisos:                     # letreros flotantes "rechazó" / "cancelado" en la vista 3D
    duracion: 2.0             # segundos reales que dura cada letrero
    subida: 1.5               # unidades por segundo que sube mientras se desvanece
    max_activos: 30           # a velocidades altas se omiten los que sobren (no se traba)

vista_2d:
  ancho: 1100
  alto: 760
  fps: 60

vista_duelo:                  # python main.py --vista duelo (antes vs después, lado a lado)
  ancho: 1500
  alto: 900
  lado_mapa: 560
  fps: 60
  muestrear_cada: 10          # minutos entre puntos de las curvas en vivo

vista_duelo_3d:               # python main.py --vista duelo3d
  separacion: 4               # cuadras de pasto entre las dos ciudades
  encuadre: 1.12              # ancho visible = ancho de las dos ciudades × esto (más = más lejos; la rueda también)
  margen_marcador: 0.08       # borde vertical del panel del marcador final (unidades de pantalla de Ursina)
  ancho_marcador: 0.86        # fracción del ancho de la ventana que ocupa el panel del marcador
  color_antes: "#6ea0f0"      # azul = sin entrenar, ámbar = entrenada (los mismos de la vista duelo 2D)
  color_despues: "#f0b428"

vista_3d:                     # python main.py --vista 3d / duelo3d (vistas/vista_3d.py y vistas/maqueta_3d.py)
  encuadre: 1.75              # ancho visible = ancho de la ciudad × esto (más = más lejos; la rueda también)
  camara: {inclinacion: 44, giro: 24, giro_auto: 6}   # grados; giro_auto: grados/s con la tecla C
  semilla_decorado: 11        # árboles, colores de las casas, nubes: solo adorno, no toca el azar del modelo
  antialiasing: 4             # muestras MSAA (0 = sin suavizado de bordes)
  sombras: {resolucion: 4096, sesgo: 0.0015}
  exposicion: 1.0             # multiplica toda la luz (sol y ambiente): sube si tu pantalla se ve oscura
  niebla: {inicio: 1.6, fin: 4.5, intensidad: 0.85}   # distancias × lado de la ciudad, desde la cámara
  borde: 1.3                  # cuadras de pasto alrededor de la ciudad (la maqueta)
  densidad_bosque: 0.32       # árboles por unidad² en ese borde
  prob_parque: 0.85           # cuadrantes libres que son parque (el resto, plaza con flores)
  arboles_por_parque: [1, 4]
  pisos_oficina: [6, 13]
  ventanas_encendidas: 0.6    # fracción de ventanas que se prenden de noche
  faroles_cada: 2             # un farol cada tantas intersecciones
  radio_halo: 0.6             # charco de luz de cada farol
  escala_moto: 1.5            # las motos van exageradas: a escala real no se verían
  suavizado_giro: 10          # qué tan rápido gira la moto hacia su rumbo (1/s)
  pin: {altura: 1.1, rebote: 0.12, escala: 1.15, giro: 60}   # giro en grados/s
  icono: {altura: 1.25, escala: 1.1, giro: 45, letrero: 22}     # ícono 3D que gira sobre cada restaurante
  # La comida que flota sobre la moto mientras lleva un pedido (altura en unidades de mundo,
  # giro en grados/s, rebote: cuánto sube y baja, frecuencia_rebote en rad/s)
  comida_en_moto: {altura: 2.4, escala: 1.8, giro: 120, rebote: 0.12, frecuencia_rebote: 4}
  nubes: {cantidad: 8, altura: [4, 8], distancia: [1.5, 2.1], arco: [-15, 195], escala: [0.9, 1.6], velocidad: 0.35, gris_lluvia: 0.3}
  fondo_bajo: 0.35            # debajo del horizonte: mezcla horizonte→cenit (la maqueta flota en el cielo)
  lluvia: {gotas: 900, alto: 9, velocidad: 14, transicion: 0.5, opacidad: 0.55}
  # Carros de las calles trancadas: avanzan "a pedazos" (velocidad que sube y baja hasta casi
  # parar cada `periodo` segundos reales). Se mueven en la tarjeta de video (vistas/sombreado.py).
  trafico: {velocidad: 0.22, periodo: 3.0, escala_carro: 1.0, espacio_carros: 0.2, fase_maxima: 0.95,
            luces_dia: 0.55}   # transicion: fracción por segundo real
  cielo:
    sol: {salida: 6, puesta: 18.5, elevacion_maxima: 68, inclinacion_sur: 0.9, elevacion_fundido: 5,
          elevacion_minima_sombra: 16}
    luna: {direccion: [-0.45, 0.8, -0.55]}
    lluvia: {tinte: "#e3e9f2", oscurecer: 0.78, desaturar: 0.85, factor_sol: 0.3, luces_extra: 0.35}
    # Fotogramas clave del día. cenit/horizonte: cielo; sol: color de la luz (de noche, la luna);
    # cielo/suelo: luz ambiente que llega de arriba/de abajo; noche: 0-1, prende ventanas y faroles.
    ciclo_dia:
      - {hora: 0,    cenit: "#060a1c", horizonte: "#18203d", sol: "#7086c4", intensidad: 0.32, cielo: "#1e2849", suelo: "#0b0d17", noche: 1}
      - {hora: 4.8,  cenit: "#0a1130", horizonte: "#262b52", sol: "#7086c4", intensidad: 0.3,  cielo: "#222a4d", suelo: "#0e1020", noche: 1}
      - {hora: 6,    cenit: "#3b5689", horizonte: "#f5a46b", sol: "#ffb27c", intensidad: 0.68, cielo: "#4a557a", suelo: "#2c282c", noche: 0.45}
      - {hora: 7.5,  cenit: "#4c8cd4", horizonte: "#cfe2f0", sol: "#ffe6c4", intensidad: 0.74, cielo: "#4f6177", suelo: "#30352c", noche: 0}
      - {hora: 12,   cenit: "#3b82d6", horizonte: "#c2e1f6", sol: "#fff6e8", intensidad: 0.78, cielo: "#4d6076", suelo: "#33382d", noche: 0}
      - {hora: 16.5, cenit: "#4886cf", horizonte: "#ead9b8", sol: "#ffe3b5", intensidad: 0.76, cielo: "#4f5f72", suelo: "#36332a", noche: 0}
      - {hora: 18.2, cenit: "#3f5590", horizonte: "#ff8a57", sol: "#ff9a5e", intensidad: 0.68, cielo: "#4a4c6e", suelo: "#2e2528", noche: 0.35}
      - {hora: 19.4, cenit: "#1b2250", horizonte: "#6b4a7a", sol: "#8a80d0", intensidad: 0.4,  cielo: "#30386a", suelo: "#14141e", noche: 0.9}
      - {hora: 20.6, cenit: "#080c22", horizonte: "#1a2242", sol: "#7086c4", intensidad: 0.32, cielo: "#1e2849", suelo: "#0b0d17", noche: 1}
  hud:
    fondo: "#10131a"
    opacidad: 0.8
    texto: "#e8ebf0"
    suave: "#9aa3b2"
    acento: "#ffb347"
    relleno: 0.018              # margen interno de los paneles (unidades de pantalla)
    radio: 0.012                # esquinas redondeadas
  colores:
    pasto: "#86b85c"
    pasto_oscuro: "#5e8f45"
    pasto_manzana: "#93c266"
    tierra: "#8c5d3c"
    tierra_oscura: "#6e472e"
    asfalto: "#454a55"
    anden: "#d6d0c4"
    bordillo: "#a9a397"
    raya: "#f4cf5e"
    cebra: "#f2f2ee"
    lote: "#cfc8b8"
    plaza: "#e0d6c0"
    casas: ["#f2d7b6", "#e9b9a0", "#f5e6c8", "#c9dbc0", "#bfd3e6", "#f0c9cf", "#e8d39a", "#d9c2e3"]
    techos: ["#b5533c", "#9c4632", "#7a4a3a", "#5d6b7a", "#8a5a44", "#c26b45"]
    oficinas: ["#9fb3c8", "#b8c2cc", "#8ea3a8", "#c9c1b5", "#7f93ad"]
    recepcion: "#33465c"
    maquinas: "#8d939c"
    universidad: "#efe4cc"
    techo_universidad: "#6c4a8c"
    reloj: "#fff1c9"
    bandera: "#9a74c4"
    fachada_restaurante: "#f6eedd"
    vitrina: "#ffe6ad"
    puerta: "#6b4a35"
    ladrillo: "#a2563f"
    tonos_ventana: ["#ffffff", "#fff3dc", "#eef4ff", "#ffe9c2"]
    tronco: "#7a5236"
    copas: ["#4f9a46", "#3f8a3c", "#6aad4c", "#2f7a45", "#7fb84f"]
    flores: ["#e85d75", "#f2b33d", "#b06ad9", "#f07b3f"]
    poste: "#3c4049"
    carros: ["#d9534f", "#f0ad4e", "#5bc0de", "#f7f7f7", "#3d3d46", "#6c8ebf", "#8fbf6c"]
    vidrio_carro: "#2b3a4d"
    trancon: "#b8473f"
    farola_carro: "#fff6d6"
